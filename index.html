// ─── API ──────────────────────────────────────────────────────────────────────
async function api(action, params={}, method="GET") {
  const base = ls.get(STORAGE.API_URL) || DEFAULT_API_URL;
  if (!base) throw new Error("Δεν έχει οριστεί το API URL. Πήγαινε στις Ρυθμίσεις.");
  if (method === "GET") {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const r = await fetch(`${base}?${qs}`);
    const j = await r.json();
    if (!j.success) throw new Error(j.error || "Σφάλμα");
    return j.data;
  } else {
    const r = await fetch(base, { method:"POST", body: JSON.stringify({ action, ...params }) });
    const j = await r.json();
    if (!j.success) throw new Error(j.error || "Σφάλμα");
    return j.data;
  }
}

function Spinner({ className="" }) {

function Btn({children, onClick, disabled, variant="primary", size="md", className=""}) {
  const base = "font-semibold rounded-2xl transition-all active:scale-[0.97] flex items-center justify-center gap-2";
  const sz = size==="sm" ? "px-3 py-1.5 text-sm" : size==="lg" ? "px-6 py-3.5 text-base" : "px-4 py-2.5 text-sm";
  const v = variant==="primary" ? "bg-forest-700 hover:bg-forest-800 text-white shadow-sm shadow-forest-700/20" :
            variant==="outline" ? "border border-forest-200 bg-white text-forest-700 hover:bg-forest-50" :
            variant==="ghost"   ? "text-forest-600 hover:bg-forest-50" :
            variant==="danger"  ? "bg-red-500 hover:bg-red-600 text-white" :
            variant==="accent"  ? "bg-terracotta-500 hover:bg-terracotta-600 text-white shadow-sm shadow-terracotta-500/20" : "";
  return <button onClick={onClick} disabled={disabled} className={`${base} ${sz} ${v} ${disabled?"opacity-50 cursor-not-allowed":""} ${className}`}>{children}</button>;
}
function Card({children, className=""}) {
  return <div className={`bg-white rounded-3xl border border-forest-100/70 card-shadow ${className}`}>{children}</div>;
}
function Eyebrow({children}) {
  return <p className="text-[11px] font-bold tracking-wider text-forest-500 uppercase mb-1.5">{children}</p>;
}
function Toast({msg, type="success", onClose}) {
  useEffect(()=>{ const t=setTimeout(onClose,3000); return ()=>clearTimeout(t); },[]);
  const color = type==="success"?"bg-forest-700":type==="error"?"bg-red-500":"bg-terracotta-600";
  return <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 ${color} text-white px-5 py-3 rounded-2xl shadow-xl text-sm font-medium fade-in max-w-xs text-center`}>{msg}</div>;
}
function ProgressRing({ pct, size=64, stroke=7, label, sub, color="#2f5138", track="#e0ebe1" }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const off = c - (Math.min(100,Math.max(0,pct)) / 100) * c;
  return (
    <div className="relative flex-shrink-0" style={{ width:size, height:size }}>
      <svg width={size} height={size} className="-rotate-90">
        <circle cx={size/2} cy={size/2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round" style={{ transition:"stroke-dashoffset .6s ease" }} />
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center">
        <span className="text-sm font-bold text-forest-800 font-display">{label}</span>
        {sub && <span className="text-[9px] text-gray-400 -mt-0.5">{sub}</span>}
      </div>
    </div>
  );
}

// ─── HABIT TRACKER ────────────────────────────────────────────────────────────
function HabitTab({ token, date, initialData, onSave, weekStrip, streak }) {
  const [habits, setHabits] = useState(() => {
    if (initialData?.length) return initialData.map(h=>({ habit:h.habit, done: h.done==="TRUE"||h.done===true }));
    return DEFAULT_HABITS.map(h=>({ habit:h, done:false }));
  });
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(()=>{
    if (initialData?.length) setHabits(initialData.map(h=>({ habit:h.habit, done: h.done==="TRUE"||h.done===true })));
    else setHabits(DEFAULT_HABITS.map(h=>({ habit:h, done:false })));
  }, [initialData, date]);

  const toggle = i => setHabits(p=>p.map((h,idx)=>idx===i?{...h,done:!h.done}:h));
  const done = habits.filter(h=>h.done).length;
  const pct = habits.length ? Math.round(done/habits.length*100) : 0;

  const save = async () => {
    setSaving(true);
    try {
      await api("saveHabits", { token, date, habits }, "POST");
      setToast("Αποθηκεύτηκε! ✓");
      onSave && onSave();
    } catch(e) { setToast("Σφάλμα: "+e.message); }
    setSaving(false);
  };

  return (
    <div className="space-y-4 fade-in">
      {toast && <Toast msg={toast} type={toast.includes("Σφάλμα")?"error":"success"} onClose={()=>setToast(null)} />}

      {/* Progress */}
      <Card className="p-4 flex items-center gap-4">
        <ProgressRing pct={pct} label={`${done}/${habits.length}`} color="#2f5138" />
        <div className="flex-1 min-w-0">
          <p className="text-sm font-semibold text-gray-700">Πρόοδος σήμερα</p>
          <p className="text-xs text-gray-400 mt-0.5">
            {pct===100 ? "🎉 Τέλεια! Όλες οι συνήθειες για σήμερα!" : pct>=60 ? "💪 Πολύ καλή πρόοδος!" : pct>=30 ? "🌱 Συνέχισε έτσι!" : "Ξεκίνα σήμερα — κάθε βήμα μετράει!"}
          </p>
          {streak > 0 && (
            <div className="mt-2 inline-flex items-center gap-1 bg-terracotta-100 text-terracotta-700 text-xs font-bold px-2.5 py-1 rounded-full">
              <IconFlame size={13}/> {streak} μέρες σερί
            </div>
          )}
        </div>
      </Card>

      {/* Week strip */}
      {weekStrip && weekStrip.length>0 && (
        <Card className="p-4">
          <Eyebrow>Αυτή η εβδομάδα</Eyebrow>
          <WeekStrip strip={weekStrip} streak={streak} />
        </Card>
      )}

      {/* Habit list */}
      <Card className="divide-y divide-gray-50">
        {habits.map((h,i) => (
          <button key={i} onClick={()=>toggle(i)}
            className="w-full flex items-center gap-3 px-4 py-3.5 text-left transition-colors hover:bg-forest-50/60 active:bg-forest-50">
            <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all
              ${h.done ? "bg-forest-700 border-forest-700" : "border-gray-300"}`}>
              {h.done && <span className="text-white text-xs">✓</span>}
            </div>
            <p className={`text-sm ${h.done?"text-gray-400 line-through":"text-gray-700"}`}>{h.habit}</p>
          </button>

      <Btn onClick={save} disabled={saving} className="w-full" size="lg">
        {saving ? <><Spinner/>Αποθήκευση...</> : "Αποθήκευση Καθημερινών Συνηθειών"}
      </Btn>
    </div>
  );
}

const MEAL_PLACEHOLDERS = [
  "Π.χ. Ομελέτα με 2 αυγά, 2 σπιρτόκουτα φέτα, κρεμμύδι, πιπεριά, 2 κ.σ. καλαμπόκι, ντοματίνια και ρόκα",
  "Π.χ. 4 σπιρτόκουτα κοτόπουλο, 1 φλιτζάνι ρύζι, 2 φλιτζάνια σαλάτα",
  "Π.χ. 3 κρητικά παξιμάδια με μία τριμμένη ντομάτα, 2 σπιρτόκουτα φέτα και κάπαρη",
];
const EXTRA_PLACEHOLDER = "Π.χ. Ένα φρούτο ή μια χούφτα ξηροί καρποί";
const PORTION_OPTIONS = ["Μικρή", "Κανονική", "Μεγάλη", "Φούσκωσα!"];
const mealLabel = i => MEAL_LABELS[i] || `Σνακ ${i-2}`;
const mealPlaceholder = i => MEAL_PLACEHOLDERS[i] || EXTRA_PLACEHOLDER;

// Reconstructs entries from backend data, re-attaching each entry's structured
// components by matching mealLabel (components aren't stored inline on the
// FoodLog row — they live in a separate sheet and are joined back here by position).
function buildEntries(initialData, initialComponents) {
  if (!initialData?.length) return DEFAULT_ENTRIES();
  return initialData.map((e,i)=>({
    ...e,
    hungerScore: e.hungerScore!=null&&e.hungerScore!==""?parseInt(e.hungerScore):3,
    enjoyment: e.enjoyment!=null&&e.enjoyment!==""?parseInt(e.enjoyment):3,
    emotions: typeof e.emotions==="string"&&e.emotions?e.emotions.split("|"):[],
    components: (initialComponents||[])
      .filter(c=>c.mealLabel===mealLabel(i))
      .map(c=>({ category:c.category||"", unit:c.unit||"spirtokouto", qty:c.quantity!=null&&c.quantity!==""?String(c.quantity):"1" })),
  }));
}

    setActiveIdx(0);
  }, [initialData, initialComponents, date]);

  const upd = (i,k,v) => setEntries(p=>p.map((e,idx)=>idx===i?{...e,[k]:v}:e));
  const addEntry = () => { setEntries(p=>[...p, EMPTY_ENTRY()]); setActiveIdx(entries.length); };
  const delEntry = i => { setEntries(p=>p.filter((_,idx)=>idx!==i)); setActiveIdx(Math.max(0,activeIdx-1)); };
  const toggleEmotion = (i,em) => {
    setEntries(p=>p.map((e,idx)=>idx!==i?e:{...e,emotions:e.emotions.includes(em)?e.emotions.filter(x=>x!==em):[...e.emotions,em]}));
  };
  const addComponent = i => setEntries(p=>p.map((e,idx)=>idx!==i?e:{...e, components:[...e.components, EMPTY_COMPONENT()]}));
  const delComponent = (i,ci) => setEntries(p=>p.map((e,idx)=>idx!==i?e:{...e, components:e.components.filter((_,cidx)=>cidx!==ci)}));
  const updComponent = (i,ci,k,v) => setEntries(p=>p.map((e,idx)=>idx!==i?e:{...e, components:e.components.map((c,cidx)=>{
    if (cidx!==ci) return c;

  const totalProtein = useMemo(()=> entries.reduce((s,e)=> s + (e.components||[]).reduce((s2,c)=>s2+proteinForComponent(c),0), 0), [entries]);

  const save = async () => {

// ─── FOOD FREQUENCY ───────────────────────────────────────────────────────────
function FoodFreqTab({ token, date, initialData, onSave }) {
  const ws = weekStart(date);
  const [counts, setCounts] = useState(()=>{
    const m = {};
    if (initialData?.length) initialData.forEach(r=>{ m[r.category]=r.count; });
    return m;
  });
  const [saving, setSaving] = useState(false);
  const [toast, setToast] = useState(null);
  const [habitWeekStats, setHabitWeekStats] = useState(null);
  const habitCacheRef = useRef({});
  const [foodCompStats, setFoodCompStats] = useState(null);
  const compCacheRef = useRef({});

  useEffect(()=>{
    const m = {};
    if (initialData?.length) initialData.forEach(r=>{ m[r.category]=r.count; });
    setCounts(m);
  }, [initialData, date]);

  // Auto-derived weekly stats, sourced from the Habits tab — read-only, no manual entry.
  useEffect(()=>{
    let cancelled = false;
    setHabitWeekStats(null);
    (async () => {
      const t = today();
      const days = [];
      for (let i=0;i<7;i++) {
        const d = new Date(ws); d.setDate(d.getDate()+i);
        const ds = d.toISOString().split("T")[0];
        if (ds > t) break; // don't count days that haven't happened yet
        days.push(ds);
      }
      const perDayHabits = await Promise.all(days.map(async d => {
        if (habitCacheRef.current[d]) return habitCacheRef.current[d];
        try {
          const dd = await api("getClientData", { token, date: d });
          const habits = dd?.habits || [];
          habitCacheRef.current[d] = habits;
          return habits;
        } catch { return []; }
      }));
      if (cancelled) return;
      const stats = WEEKLY_HABIT_STATS.map(s => ({
        ...s,
        count: perDayHabits.filter(habits => habits.some(h=>h.habit===s.habitText && (h.done==="TRUE"||h.done===true))).length,
        outOf: days.length,
      }));
      setHabitWeekStats(stats);
    })();
    return () => { cancelled = true; };
  }, [ws, token]);

  // Auto-derived weekly category tally + protein estimate, sourced from the optional
  // "Συστατικά" components logged per meal on the Food tab — read-only, additive
  // alongside the manual tally below (doesn't replace it).
  useEffect(()=>{
    let cancelled = false;
    setFoodCompStats(null);
    (async () => {
      const t = today();
      const days = [];
      for (let i=0;i<7;i++) {
        const d = new Date(ws); d.setDate(d.getDate()+i);
        const ds = d.toISOString().split("T")[0];
        if (ds > t) break;
        days.push(ds);
      }
      const perDayComps = await Promise.all(days.map(async d => {
        if (compCacheRef.current[d]) return compCacheRef.current[d];
        try {
          const dd = await api("getClientData", { token, date: d });
          const comps = dd?.foodComponents || [];
          compCacheRef.current[d] = comps;
          return comps;
        } catch { return []; }
      }));
      if (cancelled) return;
      const catDays = {};
      FOOD_FREQ_CATS.forEach(c=>{ catDays[c.id] = 0; });
      let proteinDaysCount = 0, proteinSum = 0;
      perDayComps.forEach(comps => {
        const catsToday = new Set();
        let dayProtein = 0;
        (comps||[]).forEach(c => {
          const qty = parseFloat(c.quantity);
          if (qty > 0) { catsToday.add(c.category); dayProtein += proteinForComponent({ category:c.category, unit:c.unit, qty }); }
        });
        catsToday.forEach(cid => { if (catDays[cid] != null) catDays[cid]++; });
        if (dayProtein > 0) { proteinDaysCount++; proteinSum += dayProtein; }
      });
      setFoodCompStats({ catDays, avgProtein: proteinDaysCount ? proteinSum/proteinDaysCount : 0, daysTracked: proteinDaysCount, outOf: days.length });
    })();
    return () => { cancelled = true; };
  }, [ws, token]);

  const setCount = (id,v) => setCounts(p=>({...p,[id]:v}));
  const logged = FOOD_FREQ_CATS.filter(c=>counts[c.id]!=null).length;

  const save = async () => {
    setSaving(true);
    try {
      const items = FOOD_FREQ_CATS.map(c=>({ category:c.id, count:counts[c.id]||"0" }));
      await api("saveFoodFrequency", { token, weekStart:ws, items }, "POST");
      setToast("Αποθηκεύτηκε! ✓");
      onSave && onSave();
    } catch(e) { setToast("Σφάλμα: "+e.message); }
    setSaving(false);
  };

  return (
    <div className="space-y-4 fade-in">
      {toast && <Toast msg={toast} type={toast.includes("Σφάλμα")?"error":"success"} onClose={()=>setToast(null)} />}

      <Card className="p-4">
        <Eyebrow>Αυτόματα από τις Καθημερινές Συνήθειες</Eyebrow>
        <p className="text-xs text-gray-400 mb-3">Εβδομάδα {fmtDate(ws)} — δεν χρειάζεται καταχώρηση, ενημερώνεται μόνο του</p>
        {habitWeekStats===null ? (
          <div className="flex justify-center py-3"><Spinner/></div>
        ) : (
          <div className="space-y-2.5">
            {habitWeekStats.map(s=>(
              <div key={s.key} className="flex items-center gap-3">
                <p className="text-sm flex-1 text-gray-600">{s.label}</p>
                <div className="flex items-center gap-2">
                  <div className="h-1.5 w-20 bg-gray-100 rounded-full overflow-hidden">
                    <div className="h-full bg-forest-500 rounded-full" style={{width:`${s.outOf?Math.round(s.count/s.outOf*100):0}%`}} />
                  </div>
                  <span className="text-xs font-bold text-forest-700 w-8 text-right">{s.count}/{s.outOf}</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <Card className="p-4">
        <Eyebrow>Αυτόματα από τις καταγραφές φαγητού</Eyebrow>
        <p className="text-xs text-gray-400 mb-3">Βάσει των "Συστατικών" που πρόσθεσες ανά γεύμα (προαιρετικό πεδίο) — δεν αντικαθιστά τη χειροκίνητη καταχώρηση από κάτω</p>
        {foodCompStats===null ? (
          <div className="flex justify-center py-3"><Spinner/></div>
        ) : foodCompStats.daysTracked===0 ? (
          <p className="text-xs text-gray-400 text-center py-2">Δεν έχεις καταγράψει ακόμα συστατικά αυτή την εβδομάδα.</p>
        ) : (
          <>
            <div className="flex items-center justify-between mb-3 pb-3 border-b border-gray-50">
              <p className="text-sm text-gray-600">Πρωτεΐνη/ημέρα (μ.ο., {foodCompStats.daysTracked}/{foodCompStats.outOf} ημέρες)</p>
              <p className="text-sm font-bold text-forest-700">≈{Math.round(foodCompStats.avgProtein)}γρ</p>
            </div>
            <div className="space-y-2">
              {FOOD_FREQ_CATS.map(cat=>(
                <div key={cat.id} className="flex items-center gap-3">
                  <p className="text-xs flex-1 text-gray-600">{cat.label}</p>
                  <div className="flex items-center gap-2">
                    <div className="h-1.5 w-16 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full bg-terracotta-400 rounded-full" style={{width:`${Math.min(100,(foodCompStats.catDays[cat.id]||0)/7*100)}%`}} />
                    </div>
                    <span className="text-xs font-bold text-terracotta-600 w-4">{foodCompStats.catDays[cat.id]||0}</span>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
      </Card>

      <Card className="p-4 flex items-center justify-between">
        <div>
          <p className="text-sm font-semibold text-gray-700 mb-0.5">Εβδομαδιαία Συχνότητα Τροφίμων (χειροκίνητα)</p>
          <p className="text-xs text-gray-400">Εβδομάδα: {fmtDate(ws)}</p>
        </div>
        <span className="text-xs font-bold text-forest-700 bg-forest-50 px-2.5 py-1 rounded-full flex-shrink-0">{logged}/{FOOD_FREQ_CATS.length}</span>
      </Card>

      <Card className="divide-y divide-gray-50">
        {FOOD_FREQ_CATS.map(cat=>(
          <div key={cat.id} className="px-4 py-3.5">
            <div className="flex justify-between items-start mb-2">
              <div>
                <p className="text-sm font-medium text-gray-700">{cat.label}</p>
                <p className="text-xs text-gray-400">{cat.hint}</p>
              </div>
              <span className="text-lg font-bold text-forest-700 ml-2 font-display">{counts[cat.id]||"0"}</span>
            </div>
            <div className="flex gap-1.5">
              {FREQ_OPTIONS.map(v=>(
                <button key={v} onClick={()=>setCount(cat.id,v)}
                  className={`flex-1 py-1.5 rounded-lg text-xs font-semibold transition-colors
                    ${(counts[cat.id]||"0")===v?"bg-forest-700 text-white":"bg-gray-100 text-gray-500 hover:bg-gray-200"}`}>
                  {v}
                </button>
              ))}
            </div>
          </div>
        ))}
      </Card>

      <Btn onClick={save} disabled={saving} className="w-full" size="lg">
        {saving ? <><Spinner/>Αποθήκευση...</> : "Αποθήκευση Συχνότητας"}
      </Btn>

  );
}

// ─── CLIENT APP ───────────────────────────────────────────────────────────────
function ClientApp({ token, name }) {
  const [date, setDate] = useState(today());
  const [tab, setTab] = useState("habits");
  const [loading, setLoading] = useState(false);
  const [data, setData] = useState(null);
  const [coachNotes, setCoachNotes] = useState([]);
  const [hasUnread, setHasUnread] = useState(false);
  const [showBanner, setShowBanner] = useState(false);
  const [weekStrip, setWeekStrip] = useState([]);
  const weekCacheRef = useRef({});

  const LAST_SEEN_KEY = "ht_coach_notes_seen_" + token;

  const loadCoachNotes = useCallback(async () => {
    try {
      const result = await api("getCoachNotes", { token });
      const notes = result?.notes || [];
      setCoachNotes(notes);
      if (notes.length > 0) {
        const lastSeen = localStorage.getItem(LAST_SEEN_KEY) || "";
        const latest = notes.reduce((a,b)=> (b.savedAt||"") > (a.savedAt||"") ? b : a, notes[0]);
        if ((latest.savedAt||"") > lastSeen) {
          setHasUnread(true);
          setShowBanner(true);
        }
      }
    } catch(e) { console.error("coach notes:", e); }
  }, [token]);

  const load = useCallback(async () => {
    setLoading(true);
    try { setData(await api("getClientData", { token, date })); }
    catch(e) { console.error(e); }
    setLoading(false);
  }, [token, date]);

  const loadWeekStrip = useCallback(async (centerDate, force) => {
    const days = [];
    const dt = new Date(centerDate);
    for (let i=6;i>=0;i--) { const d = new Date(dt); d.setDate(d.getDate()-i); days.push(d.toISOString().split("T")[0]); }
    if (force) days.forEach(d=>{ delete weekCacheRef.current[d]; });
    const results = await Promise.all(days.map(async d => {
      if (weekCacheRef.current[d]) return weekCacheRef.current[d];
      try {
        const dd = await api("getClientData", { token, date: d });
        const habits = dd?.habits || [];
        const doneCt = habits.filter(h=>h.done==="TRUE"||h.done===true).length;
        const entry = { date:d, total:habits.length, done:doneCt, pct: habits.length? Math.round(doneCt/habits.length*100):null };
        weekCacheRef.current[d] = entry;
        return entry;
      } catch { return { date:d, total:0, done:0, pct:null }; }
    }));
    setWeekStrip(results);
  }, [token]);

  useEffect(()=>{ load(); }, [load]);
  useEffect(()=>{ loadCoachNotes(); }, [loadCoachNotes]);
  useEffect(()=>{ loadWeekStrip(date, false); }, [date, loadWeekStrip]);

  const streak = useMemo(()=>{
    let s = 0; const t = today();
    for (let i=weekStrip.length-1;i>=0;i--) {
      const day = weekStrip[i];
      if (day.date >= t) continue;
      if (day.pct===100) s++; else break;
    }
    return s;
  },[weekStrip]);

  const onHabitsSaved = () => { load(); loadWeekStrip(date, true); };

  const openCoachTab = () => {
    setTab("coach");
    setHasUnread(false);
    setShowBanner(false);
    if (coachNotes.length > 0) {
      const latest = coachNotes.reduce((a,b)=> (b.savedAt||"") > (a.savedAt||"") ? b : a, coachNotes[0]);
      localStorage.setItem(LAST_SEEN_KEY, latest.savedAt||"");
    }
  };

  const prevDay = () => {
    const d = new Date(date); d.setDate(d.getDate()-1);
    setDate(d.toISOString().split("T")[0]);
  };
  const nextDay = () => {
    const d = new Date(date); d.setDate(d.getDate()+1);
    if (d <= new Date()) setDate(d.toISOString().split("T")[0]);
  };

  const tabs = [
    { id:"habits", label:"Καθημ. Συνήθειες",    icon:<IconCheck size={18}/> },
    { id:"food",   label:"Φαγητό",   icon:<IconPlate size={18}/> },
    { id:"freq",   label:"Εβδομάδα", icon:<IconWeek size={18}/> },
    { id:"notes",  label:"Σκέψεις",  icon:<IconChat size={18}/> },
    { id:"coach",  label:"Coach",     icon:<IconMail size={18}/>, unread: hasUnread, onClick: openCoachTab },
  ];
  const navTabs = tabs.map(t=>({...t, onClick: t.onClick || (()=>setTab(t.id))}));

  const logout = () => {
    if (!window.confirm("Αποσύνδεση;")) return;
    [STORAGE.TOKEN, STORAGE.NAME].forEach(k=>ls.del(k));
    window.location.reload();
  };

  return (
    <div className="min-h-screen bg-cream-100 pb-24">
      {/* Header */}
      <header className="bg-white border-b border-forest-100 sticky top-0 z-30">
        <div className="max-w-lg mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-forest-700 flex items-center justify-center text-base flex-shrink-0">🌿</div>
            <div>
              <p className="text-sm font-bold text-forest-900 leading-tight font-display">{greeting()}, {name?.split(" ")[0]}</p>
              <p className="text-xs text-gray-400 leading-tight">Let's Thrive for Life</p>
            </div>
          </div>
          <button onClick={logout} className="w-9 h-9 flex items-center justify-center text-gray-400 hover:bg-forest-50 rounded-full"><IconLogout size={18}/></button>
        </div>
      </header>

      {/* Coach notification banner */}
      {showBanner && (
        <div className="bg-forest-700 text-white px-4 py-3 flex items-center justify-between gap-3">
          <div className="flex items-center gap-2 flex-1">
            <span className="text-lg">💌</span>
            <p className="text-sm font-medium">Έχεις νέο μήνυμα από την Coach σου!</p>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            <button onClick={openCoachTab} className="text-xs font-bold bg-white text-forest-700 px-3 py-1 rounded-full">Δες το</button>
            <button onClick={()=>setShowBanner(false)} className="text-white/70 hover:text-white text-lg leading-none"><IconX size={14}/></button>
          </div>
        </div>
      )}

      <div className="max-w-lg mx-auto px-4 py-4 space-y-4">
        {/* Date nav — hidden on coach tab */}
        {tab !== "coach" && (
          <div className="flex items-center justify-between bg-white rounded-2xl border border-forest-100 card-shadow px-3 py-2.5">
            <button onClick={prevDay} className="w-9 h-9 flex items-center justify-center rounded-full hover:bg-forest-50 text-forest-700"><IconChevL size={18}/></button>
            <div className="text-center">
              <p className="text-sm font-bold text-forest-900 font-display">{fmtDate(date)}</p>
              {date===today()&&<p className="text-xs text-terracotta-600 font-semibold">Σήμερα</p>}
            </div>
            <button onClick={nextDay} disabled={date===today()} className="w-9 h-9 flex items-center justify-center rounded-full hover:bg-forest-50 text-forest-700 disabled:opacity-30"><IconChevR size={18}/></button>
          </div>
        )}

        {/* Content */}
        {tab === "coach" ? (
          <CoachNotesTab notes={coachNotes} />
        ) : loading ? (
          <div className="flex justify-center py-12"><Spinner /></div>
        ) : (
          <>
            {tab==="habits" && <HabitTab token={token} date={date} initialData={data?.habits} onSave={onHabitsSaved} weekStrip={weekStrip} streak={streak} />}
            {tab==="food"   && <FoodLogTab token={token} date={date} initialData={data?.foodLog} initialComponents={data?.foodComponents} onSave={load} />}
            {tab==="freq"   && <FoodFreqTab token={token} date={date} initialData={data?.foodFreq} onSave={load} />}
            {tab==="notes"  && <FeedbackTab token={token} date={date} initialData={data?.feedback} onSave={load} />}
          </>
        )}
      </div>

      <BottomNav tabs={navTabs} active={tab} />
    </div>
  );
}

// ─── COACH: CLIENT HISTORY ────────────────────────────────────────────────────
function ClientHistoryView({ client, password, onBack, onDeactivated }) {
  const [loading, setLoading] = useState(true);
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("habits");
  const [error, setError] = useState("");
  const [noteDate, setNoteDate] = useState(today());
  const [noteText, setNoteText] = useState("");
  const [savingNote, setSavingNote] = useState(false);
  const [noteToast, setNoteToast] = useState(null);

  const load = async () => {
    try {
      const d = await api("getClientHistory", { coachPassword:password, clientId:client.clientId });
      setData(d);
    } catch(e) { setError(e.message); }
    setLoading(false);
  };

  useEffect(()=>{ load(); }, []);

  const habitsGrouped = useMemo(()=>{
    const g = {};
    (data?.habits||[]).forEach(h=>{ if(!g[h.date])g[h.date]=[]; g[h.date].push(h); });
    return Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0]));
  },[data]);

  const avgCompletion = useMemo(()=>{
    if (habitsGrouped.length===0) return null;
    const pcts = habitsGrouped.map(([,habits])=>{
      const done = habits.filter(h=>h.done==="TRUE"||h.done===true).length;
      return habits.length ? done/habits.length*100 : 0;
    });
    return Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
  },[habitsGrouped]);

  const foodGrouped = useMemo(()=>{
    const g = {};
    (data?.foodLog||[]).forEach(e=>{ if(!g[e.date])g[e.date]=[]; g[e.date].push(e); });
    return Object.entries(g).sort((a,b)=>b[0].localeCompare(a[0]));
  },[data]);

  // Pairs each day's client comment with Lambrini's reply for the same date,
  // so the "Σκέψεις & Σχόλια" tab reads like a thread instead of two separate lists.
  const conversation = useMemo(()=>{
    const fbByDate = {}; (data?.feedback||[]).forEach(f=>{ fbByDate[f.date]=f; });
    const noteByDate = {}; (data?.coachNotes||[]).forEach(n=>{ noteByDate[n.date]=n; });
    const dates = Array.from(new Set([...Object.keys(fbByDate), ...Object.keys(noteByDate)])).sort().reverse();
    return dates.map(date=>({ date, feedback:fbByDate[date]||null, note:noteByDate[date]||null }));
  },[data]);

  const lastActive = useMemo(()=>{
    const dates = [...habitsGrouped.map(g=>g[0]), ...foodGrouped.map(g=>g[0])].sort().reverse();
    return dates[0] || null;
  },[habitsGrouped, foodGrouped]);

  // Prefill note when switching date
  useEffect(()=>{
    const existing = (data?.coachNotes||[]).find(n=>n.date===noteDate);
    setNoteText(existing?.note||"");
  },[noteDate, data]);

  const saveNote = async () => {
    if (!noteText.trim()) return;
    setSavingNote(true);
    try {
      await api("saveCoachNote", { coachPassword:password, clientId:client.clientId, date:noteDate, note:noteText }, "POST");
      setNoteToast("✓ Το σχόλιο αποθηκεύτηκε!");
      load();
    } catch(e) { setNoteToast("Σφάλμα: "+e.message); }
    setSavingNote(false);
  };

  const copyLink = async () => {
    const link = `${window.location.origin}${window.location.pathname}?token=${client.token}`;
    try { await navigator.clipboard.writeText(link); setNoteToast("✓ Ο σύνδεσμος αντιγράφηκε!"); }
    catch { setNoteToast(link); }
  };

  // Client-side only — bundles everything already fetched via getClientHistory into
  // one portable JSON file. No new backend action needed.
  const exportClientData = () => {
    const payload = {
      exportedAt: new Date().toISOString(),
      client: { name: client.name, clientId: client.clientId },
      habits: data?.habits || [],
      foodLog: data?.foodLog || [],
      foodComponents: data?.foodComponents || [],
      foodFrequency: data?.foodFreq || [],
      feedback: data?.feedback || [],
      coachNotes: data?.coachNotes || [],
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${(client.name||"client").trim().replace(/\s+/g,"_")}-health-tracker-export-${today()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setNoteToast("✓ Το αρχείο κατέβηκε.");
  };

  // Uses the existing deleteEntry action — soft-delete only: sets active=FALSE on the
  // Clients row so login stops working and they drop off the coach's active list.
  // Historical rows in every other sheet are untouched.
  const [deactivating, setDeactivating] = useState(false);
  const deactivateClient = async () => {
    if (!window.confirm(`Απενεργοποίηση του/της ${client.name};\n\nΔεν θα μπορεί πλέον να συνδεθεί με το link του/της. Το ιστορικό του/της ΔΕΝ διαγράφεται — παραμένει στο Sheet.`)) return;
    setDeactivating(true);
    try {
      await api("deleteEntry", { coachPassword:password, clientId:client.clientId }, "POST");
      onDeactivated && onDeactivated();
    } catch(e) { setNoteToast("Σφάλμα: "+e.message); setDeactivating(false); }
  };

  if (loading) return <div className="flex justify-center py-12"><Spinner /></div>;
  if (error) return <p className="text-red-500 text-sm p-4">{error}</p>;

  return (
    <div className="space-y-4 fade-in">
      {noteToast && <Toast msg={noteToast} type={noteToast.includes("Σφάλμα")?"error":"success"} onClose={()=>setNoteToast(null)} />}

      <div className="flex items-center gap-3">
        <button onClick={onBack} className="w-9 h-9 flex items-center justify-center rounded-full hover:bg-forest-50 text-forest-700"><IconArrowL size={18}/></button>
        <div className="flex-1 min-w-0">
          <h2 className="font-bold text-forest-900 font-display">{client.name}</h2>
          <p className="text-xs text-gray-400 truncate">token: {client.token}</p>
        </div>
        <button onClick={copyLink} className="flex items-center gap-1.5 text-xs font-semibold text-forest-700 border border-forest-200 rounded-xl px-3 py-2 hover:bg-forest-50 flex-shrink-0">
          <IconCopy size={14}/> Σύνδεσμος
        </button>
      </div>

      {/* Summary stats */}
      <div className="grid grid-cols-3 gap-2.5">
        <Card className="p-3 text-center">
          <p className="text-xl font-bold text-forest-700 font-display">{avgCompletion!=null?`${avgCompletion}%`:"—"}</p>
          <p className="text-[10px] text-gray-400 mt-0.5">Μ.Ο. Συνηθειών</p>
        </Card>
        <Card className="p-3 text-center">
          <p className="text-xl font-bold text-forest-700 font-display">{habitsGrouped.length}</p>
          <p className="text-[10px] text-gray-400 mt-0.5">Ημέρες με δεδομένα</p>
        </Card>
        <Card className="p-3 text-center">
          <p className="text-sm font-bold text-forest-700 font-display mt-1">{lastActive?fmtDateShort(lastActive):"—"}</p>
          <p className="text-[10px] text-gray-400 mt-0.5">Τελευταία ενεργός</p>
        </Card>
      </div>

      {/* Tabs */}
      <div className="flex gap-1 bg-white p-1 rounded-xl overflow-x-auto border border-forest-100">
        {[["habits","Καθημ. Συνήθειες"],["food","Φαγητό"],["freq","Εβδομάδα"],["notes","Σκέψεις & Σχόλια"]].map(([v,l])=>(
          <button key={v} onClick={()=>setTab(v)} className={`flex-shrink-0 flex-1 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${tab===v?"bg-forest-700 text-white":"text-gray-500"}`}>{l}</button>
        ))}
      </div>

      {tab==="habits" && (
        <div className="space-y-3">
          {habitsGrouped.length===0&&<p className="text-sm text-gray-400 text-center py-8">Δεν υπάρχουν δεδομένα</p>}
          {habitsGrouped.map(([date,habits])=>{
            const done = habits.filter(h=>h.done==="TRUE"||h.done===true).length;
            const pct = habits.length ? Math.round(done/habits.length*100) : 0;
            return (
              <Card key={date} className="p-4">
                <div className="flex justify-between items-center mb-2">
                  <p className="text-sm font-semibold text-gray-700">{fmtDate(date)}</p>
                  <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${pct===100?"bg-forest-100 text-forest-700":pct>=60?"bg-terracotta-100 text-terracotta-700":"bg-gray-100 text-gray-500"}`}>{done}/{habits.length}</span>
                </div>
                <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden mb-2">
                  <div className="h-full bg-forest-600 rounded-full" style={{width:`${pct}%`}} />
                </div>
                <div className="space-y-1">
                  {habits.map((h,i)=>(
                    <div key={i} className="flex items-center gap-2">
                      <span className={`text-xs ${(h.done==="TRUE"||h.done===true)?"text-forest-600":"text-gray-300"}`}>{(h.done==="TRUE"||h.done===true)?"✓":"○"}</span>
                      <p className={`text-xs ${(h.done==="TRUE"||h.done===true)?"text-gray-600":"text-gray-400"}`}>{h.habit}</p>
                    </div>
                  ))}
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {tab==="food" && (
        <div className="space-y-3">
          {foodGrouped.length===0&&<p className="text-sm text-gray-400 text-center py-8">Δεν υπάρχουν δεδομένα</p>}
          {foodGrouped.map(([date,entries])=>(
            <Card key={date} className="p-4">
              <p className="text-sm font-semibold text-gray-700 mb-3">{fmtDate(date)}</p>
              {entries.map((e,i)=>(
                <div key={i} className="border-b border-gray-50 last:border-0 pb-3 last:pb-0 mb-3 last:mb-0">
                  <div className="flex gap-2 text-xs text-gray-400 mb-1">
                    {e.time&&<span>🕐 {e.time}</span>}
                    {(e.hungerScore!=null&&e.hungerScore!=="")&&<span>Πείνα: {e.hungerScore}/5</span>}
                    {(e.enjoyment!=null&&e.enjoyment!=="")&&<span>Απόλαυση: {e.enjoyment}/5</span>}
                    {e.energyCal&&<span>⚡ {e.energyCal} kcal</span>}
                  </div>
                  {e.food&&<p className="text-sm text-gray-700">{e.food}</p>}
                  {e.portion&&<p className="text-xs text-gray-400">Μερίδα: {e.portion}</p>}
                  {e.emotions&&<p className="text-xs text-terracotta-600 mt-1">💭 {e.emotions}</p>}
                </div>
              ))}
            </Card>
          ))}
        </div>
      )}

      {tab==="freq" && (
        <div className="space-y-3">
          {(data?.foodFreq||[]).length===0&&<p className="text-sm text-gray-400 text-center py-8">Δεν υπάρχουν δεδομένα</p>}
          {Object.entries(
            (data?.foodFreq||[]).reduce((g,r)=>{ if(!g[r.weekStart])g[r.weekStart]=[]; g[r.weekStart].push(r); return g; },{})
          ).sort((a,b)=>b[0].localeCompare(a[0])).map(([ws,items])=>(
            <Card key={ws} className="p-4">
              <p className="text-sm font-semibold text-gray-700 mb-3">Εβδομάδα {fmtDate(ws)}</p>
              <div className="space-y-2">
                {items.map((r,i)=>{
                  const cat = FOOD_FREQ_CATS.find(c=>c.id===r.category);
                  return (
                    <div key={i} className="flex items-center gap-3">
                      <p className="text-sm flex-1 text-gray-600">{cat?.label||r.category}</p>
                      <div className="flex items-center gap-2">
                        <div className="h-1.5 w-20 bg-gray-100 rounded-full overflow-hidden">
                          <div className="h-full bg-forest-400 rounded-full" style={{width:`${Math.min(100,(parseInt(r.count)||0)/7*100)}%`}} />
                        </div>
                        <span className="text-xs font-bold text-forest-700 w-4">{r.count}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>
          ))}
        </div>
      )}

      {tab==="notes" && (
        <div className="space-y-4">
          {/* Write / edit a note */}
          <Card className="p-4 space-y-3">
            <p className="text-sm font-semibold text-gray-700">✍️ Γράψε σχόλιο για τον/την {client.name}</p>
            <p className="text-xs text-gray-400">Το σχόλιο θα φαίνεται στον πελάτη στην καρτέλα "Από την Coach".</p>
            <div>
              <label className="text-xs text-gray-400 mb-1 block">Ημερομηνία</label>
              <input type="date" value={noteDate} onChange={e=>setNoteDate(e.target.value)}
                className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm" />
            </div>
            <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} rows={4}
              placeholder={`Π.χ. "Μπράβο αυτή την εβδομάδα! Παρατηρώ μεγάλη βελτίωση στο νερό 💪"`}
              className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm resize-none" />
            <Btn onClick={saveNote} disabled={savingNote||!noteText.trim()} className="w-full">
              {savingNote?<><Spinner/>Αποθήκευση...</>:"Αποθήκευση Σχολίου"}
            </Btn>
          </Card>

          {/* Conversation: client's comment paired with Lambrini's reply, per day */}
          <p className="text-xs text-gray-400 font-medium px-1">Ιστορικό</p>
          {conversation.length===0 && <p className="text-sm text-gray-400 text-center py-6">Δεν υπάρχουν σχόλια ακόμα</p>}
          {conversation.map(({date, feedback, note})=>(
            <Card key={date} className="p-4 space-y-3">
              <p className="text-xs font-semibold text-gray-500">{fmtDate(date)}</p>

              {feedback ? (
                <div>
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wide mb-1">Σχόλιο πελάτη</p>
                  <p className="text-sm text-gray-700 whitespace-pre-wrap">{feedback.comment}</p>
                </div>
              ) : (
                <p className="text-xs text-gray-300 italic">— δεν έγραψε σχόλιο αυτή τη μέρα —</p>
              )}

              {note ? (
                <div className="pl-3 border-l-4 border-l-forest-400">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-[10px] font-bold text-forest-600 uppercase tracking-wide">Η απάντησή σου</p>
                    <button onClick={()=>{ setNoteDate(date); setNoteText(note.note); }}
                      className="text-xs text-gray-400 hover:text-forest-700">✏️ Επεξεργασία</button>
                  </div>
                  <p className="text-sm text-gray-700 whitespace-pre-wrap">{note.note}</p>
                </div>
              ) : feedback ? (
                <button onClick={()=>{ setNoteDate(date); setNoteText(""); }}
                  className="text-xs font-semibold text-forest-600 hover:text-forest-800 flex items-center gap-1">
                  ↩ Γράψε απάντηση
                </button>
              ) : null}
            </Card>
          ))}
        </div>
      )}

      {/* Client management — kept separate from the tabs above, deliberately
          out of casual reach since deactivation locks the client's access. */}
      <Card className="p-4 space-y-3">
        <Eyebrow>Διαχείριση Πελάτη</Eyebrow>
        <Btn onClick={exportClientData} variant="outline" className="w-full">
          <IconCopy size={15}/> Εξαγωγή Δεδομένων (JSON)
        </Btn>
        <p className="text-xs text-gray-400">Κατεβάζει όλο το ιστορικό του/της — δικό του αντίγραφο, ανεξάρτητα από το Sheet.</p>
        <Btn onClick={deactivateClient} disabled={deactivating} variant="danger" className="w-full">
          {deactivating ? <><Spinner/>Απενεργοποίηση...</> : "Απενεργοποίηση Πελάτη"}
        </Btn>
        <p className="text-xs text-gray-400">Κλειδώνει το login του — το ιστορικό ΔΕΝ διαγράφεται, μένει στο Sheet.</p>
      </Card>
    </div>
  );
}

// ─── COACH APP ────────────────────────────────────────────────────────────────
function CoachApp({ password }) {
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");
  const [selected, setSelected] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [newName, setNewName] = useState("");
  const [adding, setAdding] = useState(false);
  const [toast, setToast] = useState(null);
  const [search, setSearch] = useState("");
  const [newClientInfo, setNewClientInfo] = useState(null);

  const loadClients = useCallback(async () => {
    setLoading(true);
    try {
      const data = await api("getAllClients", { coachPassword:password });
      setClients(Array.isArray(data)?data:[]);
    } catch(e) { setError(e.message); }
    setLoading(false);
  }, [password]);

  useEffect(()=>{ loadClients(); }, [loadClients]);

  const filteredClients = useMemo(()=>{
    const sorted = [...clients].sort((a,b)=>(a.name||"").localeCompare(b.name||"", "el"));
    if (!search.trim()) return sorted;
    const q = search.trim().toLowerCase();
    return sorted.filter(c=>(c.name||"").toLowerCase().includes(q));
  },[clients, search]);

  const addClient = async () => {
    if (!newName.trim()) return;
    setAdding(true);
    try {
      const d = await api("addClient", { coachPassword:password, name:newName.trim() }, "POST");
      const link = `${window.location.origin}${window.location.pathname}?token=${d.token}`;
      setNewClientInfo({ name:newName.trim(), token:d.token, link });
      setNewName(""); setShowAdd(false);
      loadClients();
    } catch(e) { setToast("Σφάλμα: "+e.message); }
    setAdding(false);
  };

  const copyClientLink = async (link) => {
    try { await navigator.clipboard.writeText(link); setToast("✓ Ο σύνδεσμος αντιγράφηκε!"); }
    catch { setToast(link); }
  };

  const logout = () => {
    if (!window.confirm("Αποσύνδεση;")) return;
    ls.del(STORAGE.COACH);
    window.location.reload();
  };

  if (selected) return (
    <div className="min-h-screen bg-cream-100">
      <div className="max-w-2xl mx-auto px-4 py-4">
        <ClientHistoryView client={selected} password={password} onBack={()=>setSelected(null)}
          onDeactivated={()=>{ setSelected(null); loadClients(); }} />
      </div>
    </div>
  );

  return (
    <div className="min-h-screen bg-cream-100">
      {toast && <Toast msg={toast} type={toast.includes("Σφάλμα")?"error":"success"} onClose={()=>setToast(null)} />}
      <header className="bg-white border-b border-forest-100 sticky top-0 z-30">
        <div className="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="w-9 h-9 rounded-xl bg-forest-700 flex items-center justify-center text-base">🌿</div>
            <div>
              <p className="text-sm font-bold text-forest-900 font-display">Coach Dashboard</p>
              <p className="text-xs text-gray-400">Let's Thrive for Life</p>
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={logout} className="w-9 h-9 flex items-center justify-center text-gray-400 hover:bg-forest-50 rounded-full"><IconLogout size={18}/></button>
          </div>
        </div>
      </header>

      <div className="max-w-2xl mx-auto px-4 py-4 space-y-4">

        {/* New client link card */}
        {newClientInfo && (
          <Card className="p-4 space-y-3 pop border-forest-200">
            <div className="flex items-center justify-between">
              <p className="text-sm font-bold text-forest-900">✓ Ο/Η {newClientInfo.name} προστέθηκε!</p>
              <button onClick={()=>setNewClientInfo(null)} className="text-gray-300 hover:text-gray-500"><IconX size={16}/></button>
            </div>
            <p className="text-xs text-gray-400">Στείλε αυτόν τον προσωπικό σύνδεσμο — ανοίγει κατευθείαν τον tracker, χωρίς login.</p>
            <div className="flex items-center gap-2 bg-forest-50 rounded-xl px-3 py-2">
              <p className="text-xs text-forest-800 truncate flex-1">{newClientInfo.link}</p>
              <button onClick={()=>copyClientLink(newClientInfo.link)} className="flex-shrink-0 text-forest-700"><IconCopy size={16}/></button>
            </div>
            <a href={`https://wa.me/?text=${encodeURIComponent(`Γεια σου ${newClientInfo.name}! Εδώ είναι ο προσωπικός σου σύνδεσμος για το Health Tracker: ${newClientInfo.link}`)}`}
              target="_blank" rel="noopener noreferrer" className="block">
              <Btn className="w-full" size="sm">Αποστολή μέσω WhatsApp</Btn>
            </a>
          </Card>
        )}

        {/* Stats */}
        <div className="grid grid-cols-2 gap-3">
          <Card className="p-4 text-center">
            <p className="text-2xl font-bold text-forest-700 font-display">{clients.length}</p>
            <p className="text-xs text-gray-400 mt-0.5">Ενεργοί Πελάτες</p>
          </Card>
          <Card className="p-4 flex items-center justify-center">
            <Btn onClick={()=>setShowAdd(p=>!p)} size="sm"><IconPlus size={15}/> Νέος Πελάτης</Btn>
          </Card>
        </div>

        {/* Add client form */}
        {showAdd && (
          <Card className="p-4 space-y-3 fade-in">
            <p className="text-sm font-semibold text-gray-700">Προσθήκη Πελάτη</p>
            <input value={newName} onChange={e=>setNewName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addClient()}
              placeholder="Όνομα πελάτη" className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm" />
            <div className="flex gap-2">
              <Btn onClick={addClient} disabled={adding||!newName.trim()} className="flex-1">
                {adding?<Spinner/>:"Δημιουργία"}
              </Btn>
              <Btn onClick={()=>setShowAdd(false)} variant="outline">Ακύρωση</Btn>
            </div>
          </Card>
        )}

        {/* Client list */}
        <Card className="divide-y divide-gray-50">
          <div className="px-4 py-3 space-y-2.5">
            <div className="flex justify-between items-center">
              <p className="text-sm font-semibold text-gray-700">Πελάτες</p>
              <button onClick={loadClients} className="text-xs text-forest-600 hover:text-forest-800">↻ Ανανέωση</button>
            </div>
            {clients.length>0 && (
              <div className="relative">
                <IconSearch size={14} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300" />
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Αναζήτηση πελάτη..."
                  className="w-full border border-gray-200 rounded-xl pl-9 pr-3 py-2 text-sm" />
              </div>
            )}
          </div>
          {loading ? (
            <div className="flex justify-center py-8"><Spinner /></div>
          ) : error ? (
            <p className="text-sm text-red-500 px-4 py-4">{error}</p>
          ) : filteredClients.length===0 ? (
            <p className="text-sm text-gray-400 text-center py-8">{clients.length===0?"Δεν υπάρχουν πελάτες ακόμα":"Κανένα αποτέλεσμα"}</p>
          ) : filteredClients.map(c=>(
            <div key={c.clientId} className="w-full flex items-center gap-3 px-4 py-3.5 hover:bg-forest-50/50 transition-colors">
              <button onClick={()=>setSelected(c)} className="flex items-center gap-3 flex-1 min-w-0 text-left">
                <div className="w-9 h-9 rounded-full bg-forest-100 flex items-center justify-center text-sm font-bold text-forest-700 flex-shrink-0 font-display">
                  {c.name?.[0]?.toUpperCase()||"?"}
                </div>
                <div className="flex-1 min-w-0">
                  <p className="text-sm font-semibold text-gray-800 truncate">{c.name}</p>
                  <p className="text-xs text-gray-400 truncate">token: {c.token}</p>
                </div>
              </button>
              <button onClick={()=>copyClientLink(`${window.location.origin}${window.location.pathname}?token=${c.token}`)}
                className="w-8 h-8 flex-shrink-0 flex items-center justify-center text-gray-300 hover:text-forest-700 hover:bg-forest-50 rounded-full" title="Αντιγραφή συνδέσμου">
                <IconCopy size={15}/>
              </button>
              <button onClick={()=>setSelected(c)} className="text-gray-300 flex-shrink-0"><IconChevR size={16}/></button>
            </div>
          ))}
        </Card>

        <div className="h-6" />
      </div>
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(()=>{
    const token = ls.get(STORAGE.TOKEN);
    const name  = ls.get(STORAGE.NAME);
    const coach = ls.get(STORAGE.COACH);
    if (token && name) return { type:"client", token, name };
    if (coach) return { type:"coach", password:coach };
    return null;
  });
  const [checkedLink, setCheckedLink] = useState(false);

  useEffect(()=>{
    if (session) { setCheckedLink(true); return; }
    const params = new URLSearchParams(window.location.search);
    const t = params.get("token");
    if (!t) { setCheckedLink(true); return; }
    (async () => {
      try {
        const data = await api("getClient", { token: t });
        ls.set(STORAGE.TOKEN, t);
        ls.set(STORAGE.NAME, data.name);
        window.history.replaceState({}, "", window.location.pathname);
        setSession({ type:"client", token:t, name:data.name });
      } catch(e) { /* invalid/expired link — fall back to manual login */ }
      setCheckedLink(true);
    })();
  }, []);

  if (!checkedLink) return <SplashScreen />;
  if (!session) return <LoginView onLogin={setSession} />;
  if (session.type==="coach") return <CoachApp password={session.password} />;
  return <ClientApp token={session.token} name={session.name} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
